/* Layout: the classroom from above. Each table is a card of student photo tiles;
   the rubric "markers" dock at the right on wide screens and along the bottom on phones. */
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface-2:#F2F5F8; --ink:#15202B; --muted:#586674; --line:#D2DAE1;
  --accent:#1B4FD8; --accent-ink:#FFFFFF; --accent-soft:#DCE5FF;
  --g2:#17784A; --g2-soft:#DCF0E4;
  --g1:#7A5200; --g1-soft:#FFF1C2; --g1-fill:#FFD338; --g1-on:#3A2800; --g1-line:#E0B41E;
  --g0:#B3261E; --g0-soft:#FCE0DB; --g0-fill:#E5483A; --g0-on:#FFFFFF; --g0-line:#D0473A;
  --ph-s:38%; --ph-l:82%; --ph-ink:28%;
  --scrim:rgba(12,18,24,.42);
  --shadow:0 1px 2px rgba(21,32,43,.06), 0 6px 18px rgba(21,32,43,.07);
  --shadow-lift:0 12px 32px rgba(21,32,43,.24);
  --f-ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mark:"Kalam", "Segoe Print", "Bradley Hand", "Chalkboard SE", cursive;
  --tray-h:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#172029; --surface-2:#1E2934; --ink:#E4EBF2; --muted:#97A5B3; --line:#2B3844;
    --accent:#8AA8FF; --accent-ink:#0E141A; --accent-soft:#1F2C4D;
    --g2:#6FD39A; --g2-soft:#15321F;
    --g1:#F4CD5A; --g1-soft:#3A2F0B; --g1-fill:#F2C636; --g1-on:#2B1E00; --g1-line:#9C7A12;
    --g0:#FF8A7D; --g0-soft:#43201B; --g0-fill:#E5534A; --g0-on:#FFFFFF; --g0-line:#A8433A;
    --ph-s:24%; --ph-l:30%; --ph-ink:84%;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    --shadow-lift:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#172029; --surface-2:#1E2934; --ink:#E4EBF2; --muted:#97A5B3; --line:#2B3844;
  --accent:#8AA8FF; --accent-ink:#0E141A; --accent-soft:#1F2C4D;
  --g2:#6FD39A; --g2-soft:#15321F;
  --g1:#F4CD5A; --g1-soft:#3A2F0B; --g1-fill:#F2C636; --g1-on:#2B1E00; --g1-line:#9C7A12;
  --g0:#FF8A7D; --g0-soft:#43201B; --g0-fill:#E5534A; --g0-on:#FFFFFF; --g0-line:#A8433A;
  --ph-s:24%; --ph-l:30%; --ph-ink:84%;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --shadow-lift:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{padding-inline:16px;padding-block:12px calc(var(--tray-h) + 28px);max-width:1640px;margin:0 auto;--tile:100px}
.app[data-size="s"]{--tile:80px}
.app[data-size="l"]{--tile:128px}
@media (max-width:599px){
  .app{--tile:88px}
  .app[data-size="s"]{--tile:70px}
  .app[data-size="l"]{--tile:136px}
}

/* ---------- header ---------- */
.top{display:flex;flex-direction:column;gap:10px;padding-block:4px 14px}
.row1,.row2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.row1{justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.course{font-family:var(--f-mark);font-size:28px;line-height:1;color:var(--accent);letter-spacing:.01em}
.subtitle{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--g0);border-color:var(--g0-line);background:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.icon{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1;font-weight:700}
.week{display:flex;align-items:center;gap:6px}
.week select{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;font-weight:700;font-size:15px;min-width:132px}
.field{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-width:0;flex:1 1 150px;max-width:260px}
.field span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{border:0;background:transparent;min-width:0;flex:1;height:100%;outline:none;font-size:15px}
.field:focus-within{border-color:var(--accent)}
.tally{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;font-weight:700;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.pill i{width:10px;height:10px;border-radius:50%;display:block}
.pill.p2 i{background:var(--g2)} .pill.p1 i{background:var(--g1-fill)} .pill.p0 i{background:var(--g0-fill)}
.save{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.save i{width:8px;height:8px;border-radius:50%;background:var(--g2);display:block}
.save[data-s="busy"] i{background:var(--g1-fill)}
.save[data-s="err"] i{background:var(--g0-fill)}
.save[data-s="local"] i{background:var(--muted)}
.sizes{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;height:44px;background:var(--surface)}
.sizes button{border:0;background:transparent;width:40px;font-weight:700;font-size:13px;color:var(--muted)}
.sizes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* ---------- banners ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);margin-bottom:14px;font-size:14px}
.banner p{margin:0;flex:1 1 260px;min-width:0}
#modeBar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);margin-bottom:14px;box-shadow:var(--shadow-lift)}
.bar p{margin:0;flex:1 1 200px;font-weight:700;font-size:14px;min-width:0}
.bar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg);min-height:38px}
.bar .chip{pointer-events:none;min-height:34px;padding:4px 10px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(var(--tile)*3 + 90px)),1fr));gap:16px;align-items:start}
.tbl{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px 6px;min-width:0}
.tbl-h{display:flex;align-items:center;gap:10px;padding:2px 2px 6px}
.tbl-n{margin:0;display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl-n b{font-family:var(--f-mark);font-size:30px;line-height:1;color:var(--ink);letter-spacing:0;text-transform:none}
.tbl-meta{margin-left:auto;display:flex;gap:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px}
.mini.m1{background:var(--g1-soft);color:var(--g1)} .mini.m0{background:var(--g0-soft);color:var(--g0)}
.tbl-tools{display:flex;gap:6px;margin-left:auto}
.grp{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;padding-block:8px;border-top:1.5px dashed var(--line)}
.grp-l{font-family:var(--f-mark);font-size:22px;line-height:1;color:var(--muted);text-align:center;padding-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;gap:5px;padding:5px 5px 7px;border-radius:13px;border:2px solid transparent;background:var(--surface-2);text-align:left;min-width:0;transition:transform .12s ease, box-shadow .12s ease;touch-action:manipulation}
.tile > *{pointer-events:none}
.tile[data-g="1"]{background:var(--g1-soft);border-color:var(--g1-line)}
.tile[data-g="0"]{background:var(--g0-soft);border-color:var(--g0-line)}
.tile.hot{transform:scale(1.05);box-shadow:0 0 0 3px var(--accent), var(--shadow-lift);z-index:2}
.tile.flash{animation:flash .5s ease}
@keyframes flash{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.ph{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:100%;border-radius:9px;overflow:hidden;background:hsl(var(--hue,210) var(--ph-s) var(--ph-l));color:hsl(var(--hue,210) 45% var(--ph-ink));font-weight:700;font-size:calc(var(--tile) * .3);letter-spacing:.02em}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;background:var(--surface);color:var(--g2);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tile[data-g="1"] .badge{background:var(--g1-fill);color:var(--g1-on)}
.tile[data-g="0"] .badge{background:var(--g0-fill);color:var(--g0-on)}
.note-dot{position:absolute;top:9px;left:9px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.note-dot svg{width:13px;height:13px}
.nm{font-weight:700;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-inline:2px}
.why{font-size:11.5px;line-height:1.2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:2px}
.tile[data-g="1"] .why{color:var(--g1)} .tile[data-g="0"] .why{color:var(--g0)} .tile[data-g="2"] .why{color:var(--muted)}
.add-tile{display:grid;place-items:center;align-content:center;gap:4px;min-height:calc(var(--tile) + 30px);border-radius:13px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px}
.add-tile b{font-size:26px;line-height:1}
.add-table{min-height:160px;border-radius:18px}
.state{grid-column:1/-1;background:var(--surface);border-radius:18px;padding:28px 22px;box-shadow:var(--shadow);max-width:640px}
.state h2{margin:0 0 6px;font-size:22px;text-wrap:balance}
.state p{margin:0 0 16px;color:var(--muted);max-width:60ch}
.state .btns{display:flex;gap:10px;flex-wrap:wrap}
.loading{grid-column:1/-1;color:var(--muted);padding:40px 4px;font-weight:700}

/* ---------- rubric markers ---------- */
.rubric{background:var(--surface);box-shadow:var(--shadow);z-index:20}
.rb-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rb-title{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rb-hint{margin:0;font-size:13px;color:var(--muted);flex:1 1 160px;min-width:0}
.rb-sec h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rb-sec[data-lvl="1"] h3{color:var(--g1)} .rb-sec[data-lvl="0"] h3{color:var(--g0)}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;line-height:1.25;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:nowrap;flex:none;text-align:left;touch-action:pan-x}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip.y{background:var(--g1-soft);border-color:var(--g1-line)} .chip.y .dot{background:var(--g1-fill)}
.chip.r{background:var(--g0-soft);border-color:var(--g0-line)} .chip.r .dot{background:var(--g0-fill)}
.chip.G1{background:var(--g1-fill);border-color:var(--g1-fill);color:var(--g1-on)}
.chip.G0{background:var(--g0-fill);border-color:var(--g0-fill);color:var(--g0-on)}
.chip.G2{background:var(--g2-soft);border-color:var(--g2);color:var(--g2)}
.chip.armed{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.chip.lifted{opacity:.4}
.rubric.ro .chip{opacity:.45;cursor:not-allowed}
.lbl-f{display:none}
.ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;box-shadow:var(--shadow-lift);transform-origin:center;max-width:280px;white-space:normal}
.rb-ref{font-size:13px;color:var(--muted)}
.rb-ref summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:36px;display:flex;align-items:center}
.rb-ref p{margin:6px 0}
.rb-ref b{color:var(--ink)}

@media (min-width:900px){
  .rubric{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100dvh - 24px);overflow:auto;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
  .rb-top{flex-direction:column;align-items:stretch;gap:8px}
  .rb-hint{flex:none}
  .rb-body{display:flex;flex-direction:column;gap:16px}
  .rb-sec{display:flex;flex-direction:column;gap:8px}
  .chips{flex-direction:column}
  .chip{white-space:normal;width:100%;touch-action:pan-y}
  .chip.y,.chip.r{font-weight:400;font-size:14px}
  .chip .lbl-s{display:none} .chip .lbl-f{display:inline}
  #trayToggle{display:none}
}
@media (max-width:899px){
  .rubric{position:fixed;left:0;right:0;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14)}
  .rb-top{padding-inline:16px}
  .rb-title,.rb-ref,.rb-sec h3{display:none}
  .rb-body{display:flex;flex-direction:column;gap:8px;padding-top:8px}
  .chips{overflow-x:auto;padding:2px 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .rubric.collapsed .rb-body{display:none}
  #trayToggle{width:38px;height:38px;font-size:18px}
  .rubric.collapsed #trayToggle{transform:rotate(180deg)}
}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:grid;align-items:end;justify-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(100%,640px);max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;padding:22px 24px}}
.sheet h2{margin:0;font-size:21px;text-wrap:balance}
.sheet h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0}
.hint{font-size:13px;color:var(--muted)}
.sh-x{position:absolute;top:10px;right:10px}
.sheet > :first-child{padding-right:48px}
.board.editing .grp{grid-template-columns:40px minmax(0,1fr)}
.grp-l .btn{margin-top:6px;min-width:36px;padding:4px}
.sh-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.sh-photo{display:flex;flex-direction:column;gap:8px;width:128px;flex:none}
.sh-photo .ph{--tile:128px;border-radius:14px}
.sh-id{flex:1 1 220px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fv{display:flex;flex-direction:column;gap:4px;min-width:0}
.fv > span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fv input,.fv select,.fv textarea{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:9px 12px;font-size:15px;width:100%}
.fv textarea{resize:vertical;min-height:84px;line-height:1.4}
.fv input:focus,.fv select:focus,.fv textarea:focus{outline:none;border-color:var(--accent)}
.seat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.seg button small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.seg button[data-g="2"][aria-pressed="true"]{background:var(--g2-soft);border-color:var(--g2);color:var(--g2)}
.seg button[data-g="1"][aria-pressed="true"]{background:var(--g1-fill);border-color:var(--g1-fill);color:var(--g1-on)}
.seg button[data-g="0"][aria-pressed="true"]{background:var(--g0-fill);border-color:var(--g0-fill);color:var(--g0-on)}
.seg button[aria-pressed="true"] small{color:inherit}
.kwl{display:flex;flex-direction:column;gap:6px}
.kwb{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:14px}
.kwb .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.kwb .box svg{width:14px;height:14px;opacity:0}
.kwb.y[aria-pressed="true"]{background:var(--g1-soft);border-color:var(--g1-line)}
.kwb.r[aria-pressed="true"]{background:var(--g0-soft);border-color:var(--g0-line)}
.kwb.y[aria-pressed="true"] .box{background:var(--g1-fill);border-color:var(--g1-fill);color:var(--g1-on)}
.kwb.r[aria-pressed="true"] .box{background:var(--g0-fill);border-color:var(--g0-fill);color:var(--g0-on)}
.kwb[aria-pressed="true"] .box svg{opacity:1}
.kwb .lv{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.sh-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-top:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.preview{padding:12px 14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.preview ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted);max-height:120px;overflow:auto}
.matches{display:flex;flex-direction:column;gap:8px;max-height:46dvh;overflow:auto}
.match{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center}
.match img{width:52px;height:52px;border-radius:10px;object-fit:cover;display:block}
.match .fn{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match select{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 8px;width:100%}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
code{font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:6px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tray-h) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:8px 8px 8px 16px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lift);font-weight:700;font-size:14px}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;border-radius:10px;background:var(--bg);color:var(--ink);font-weight:700;min-height:36px;padding:0 14px;flex:none}
@media (min-width:900px){.toast{bottom:22px}}

body.dragging, body.dragging *{cursor:grabbing !important;user-select:none;-webkit-user-select:none}
@media (max-width:599px){
  .actions .btn{padding:8px 11px}
  .field{flex-basis:130px}
}
.more > summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;gap:8px;color:var(--accent)}
.more[open] > summary{margin-bottom:10px}
.more > div{display:flex;flex-direction:column;gap:14px}
.sid{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.course{font-size:clamp(22px,6vw,28px);overflow-wrap:anywhere}
.tbl-un{background:transparent;border:2px dashed var(--line);box-shadow:none}
.tbl-un .tbl-n{font-size:15px;letter-spacing:.06em}
.grp.nolabel{grid-template-columns:minmax(0,1fr)}
.icon svg{width:22px;height:22px}
.brand-btn{border:0;background:transparent;padding:2px 8px 2px 0;border-radius:12px;cursor:pointer;text-align:left;align-items:center;gap:8px;color:inherit;min-height:44px}
.brand-btn .caret{font-size:15px;color:var(--muted)}
.brand-btn:hover .caret{color:var(--accent)}
.boards{display:flex;flex-direction:column;gap:8px}
.board-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.board-row .bt{font-weight:700;font-size:16px}
.board-row .bm{font-size:13px;color:var(--muted)}
.board-row.current{border-color:var(--accent);background:var(--accent-soft)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tw{display:flex;align-items:center;gap:8px}
.tw span{width:34px;font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tw input{flex:1;min-width:0;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);padding:6px 10px;font-size:15px}
.lvls{display:flex;flex-direction:column;gap:14px}
.lvl{padding:12px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.lvl h3{margin:0}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,2fr) 44px;gap:8px;align-items:center}
.rrow select,.rrow input{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:8px 10px;font-size:15px;width:100%;min-width:0}
.rrow[data-lvl="1"] select{background:var(--g1-soft);border-color:var(--g1-line)}
.rrow[data-lvl="0"] select{background:var(--g0-soft);border-color:var(--g0-line)}
@media (max-width:599px){.rrow{grid-template-columns:84px minmax(0,1fr) 44px}.rrow input[data-f="full"]{grid-column:1/-1;grid-row:2}}
.ready{padding:12px 14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.missing{margin:0;padding-left:18px;font-size:13px;max-height:180px;overflow:auto}
.missing code{font-size:12px}
@media (prefers-reduced-motion: reduce){ .tile,.tile.flash{transition:none;animation:none} }
</style>
</head>

  <header class="top">
    <div class="row1">
      <button class="brand brand-btn" id="btnBoards" type="button" aria-label="Switch board" title="Switch board"><span class="course" id="brandTitle">Participation Board</span><span class="caret" aria-hidden="true">▾</span></button>
      <div class="actions">
        <button class="icon" id="btnSettings" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="btn" id="btnRoster" type="button">Roster</button>
        <button class="btn" id="btnPhotos" type="button">Photos</button>
        <button class="btn primary" id="btnExport" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16h12"/></svg>Export</button>
      </div>
    </div>
    <div class="row2">
      <div class="week">
        <button class="icon" id="wkPrev" type="button" aria-label="Previous week">‹</button>
        <select id="wkSel" aria-label="Week"></select>
        <button class="icon" id="wkNext" type="button" aria-label="Next week">›</button>
      </div>
      <label class="field"><span>Topic</span><input id="wkTopic" placeholder="e.g. Intro" autocomplete="off"></label>
      <label class="field"><span>TA</span><input id="wkTA" placeholder="Your name" autocomplete="off"></label>
      <div class="tally" id="tally" aria-label="Points this week"></div>
      <div class="sizes" role="group" aria-label="Tile size">
        <button type="button" data-size="s" aria-pressed="false" id="sizeS">S</button>
        <button type="button" data-size="m" aria-pressed="true" id="sizeM">M</button>
        <button type="button" data-size="l" aria-pressed="false" id="sizeL">L</button>
      </div>
      <div class="save" id="saveState" data-s="local"><i></i><span>Loading…</span></div>
    </div>
  </header>

  <div class="layout">
    <div class="main-col">
      <div id="banners"></div>
      <div id="modeBar"></div>
      <main class="board" id="board" aria-live="polite">
        <div class="loading">Loading your class…</div>
      </main>
    </div>

    <aside class="rubric" id="rubric" aria-label="Rubric markers">
      <div class="rb-top">
        <p class="rb-title">Rubric markers</p>
        <p class="rb-hint">Drag onto a student, or tap a marker to stamp several.</p>
        <div class="chip G2" role="button" tabindex="0" data-k="G2"><span class="lbl-s">↺ 2 pts</span><span class="lbl-f">↺ Back to 2 pts (clears reasons)</span></div>
        <button class="icon" id="trayToggle" type="button" aria-expanded="true" aria-label="Hide markers">▾</button>
      </div>
      <div class="rb-body">
        <section class="rb-sec" data-lvl="1">
          <h3 id="rbH1">1 pt</h3>
          <div class="chips" id="rbChips1">
            <div class="chip G1" role="button" tabindex="0" data-k="G1"><span class="lbl-s">1 pt</span><span class="lbl-f">1 pt, no reason</span></div>
          </div>

<script>
/* Participation workbook builder. All wording comes from the board's settings. */
function buildRubricWorkbook(ExcelJS, input) {
  // input: { title, levels:{2:{name,short,desc},1:{...},0:{...}}, notes, keywords:[{key,lvl,full,archived}],
  //          tables:[{id, unassigned, groups:[{id, students:[{sid,name,studentId}]}]}],
  //          weeks:[{num, ta, topic, grades:{sid:{g,reasons,note}}}], summary }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Participation Board';
  wb.created = new Date();
  wb.calcProperties.fullCalcOnLoad = true;

  const L = input.levels;
  const KW = new Map(input.keywords.map(k => [k.key, k]));
  const FILL = c => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: c } });
  const Y_SOFT = 'FFFFF2CC', R_SOFT = 'FFF8D7DA', YELLOW = 'FFFFFF00', HEAD = 'FFE7ECF1';
  const thin = { style: 'thin', color: { argb: 'FFB8C2CC' } };
  const BORDER = { top: thin, left: thin, bottom: thin, right: thin };
  const tableVal = t => (t.unassigned ? 'Unassigned' : /^\d+$/.test(String(t.id)) ? Number(t.id) : String(t.id));
  const gradeOf = r => (r && typeof r.g === 'number' ? r.g : 2);
  const ptsLabel = p => `${p} pt${p === 2 ? 's' : ''}`;
  const active = input.keywords.filter(k => !k.archived);
  const kwRange = `Lists!$A$1:$A$${Math.max(1, active.length)}`;
  const weeks = [...input.weeks].sort((a, b) => a.num - b.num);

  if (input.summary && weeks.length) {
    const hasId = input.tables.some(t => t.groups.some(g => g.students.some(s => s.studentId)));
    const C0 = hasId ? 4 : 3;
    const sm = wb.addWorksheet('Summary', { views: [{ state: 'frozen', xSplit: C0, ySplit: 2 }] });
    const nW = weeks.length;
    const idVal = v => (/^[1-9]\d{0,14}$/.test(String(v || '')) ? Number(v) : (v || null));
    sm.getCell(1, 1).value = `${input.title}: points per week (2 = ${L[2].short}, 1 = ${L[1].short}, 0 = ${L[0].short})`;
    sm.getCell(1, 1).font = { bold: true, size: 12 };
    const head = ['Table', 'Group', ...(hasId ? ['Student ID'] : []), 'Student Name', ...weeks.map(w => `W${w.num}${w.topic ? ' ' + w.topic : ''}`), 'Total', 'Max'];
    head.forEach((h, i) => {
      const c = sm.getCell(2, i + 1);
      c.value = h; c.font = { bold: true }; c.fill = FILL(HEAD); c.border = BORDER;
      c.alignment = { wrapText: true, vertical: 'middle', horizontal: i >= C0 ? 'center' : 'left' };
    });
    sm.getRow(2).height = 32;
    sm.getColumn(1).width = 11; sm.getColumn(2).width = 7;
    if (hasId) sm.getColumn(3).width = 12;
    sm.getColumn(C0).width = 32;
    for (let i = 0; i < nW; i++) sm.getColumn(C0 + 1 + i).width = 9;
    sm.getColumn(C0 + 1 + nW).width = 8; sm.getColumn(C0 + 2 + nW).width = 8;
    let r = 3;
    for (const t of input.tables) for (const g of t.groups) for (const s of g.students) {
      sm.getCell(r, 1).value = tableVal(t);
      sm.getCell(r, 2).value = g.id || null;
      if (hasId) sm.getCell(r, 3).value = idVal(s.studentId);
      sm.getCell(r, C0).value = s.name;
      weeks.forEach((w, i) => {
        const c = sm.getCell(r, C0 + 1 + i);
        const pts = gradeOf(w.grades[s.sid]);
        c.value = pts; c.alignment = { horizontal: 'center' };
        if (pts === 1) c.fill = FILL(Y_SOFT);
        if (pts === 0) c.fill = FILL(R_SOFT);
      });
      const first = sm.getCell(r, C0 + 1).address, last = sm.getCell(r, C0 + nW).address;
      sm.getCell(r, C0 + 1 + nW).value = { formula: `SUM(${first}:${last})`, result: weeks.reduce((a, w) => a + gradeOf(w.grades[s.sid]), 0) };
      sm.getCell(r, C0 + 1 + nW).font = { bold: true };
      sm.getCell(r, C0 + 2 + nW).value = nW * 2;
      for (let c = 1; c <= C0 + 2 + nW; c++) sm.getCell(r, c).border = BORDER;
      r++;
    }
  }

  for (const w of weeks) {
    const ws = wb.addWorksheet(`Week ${w.num}`, { views: [{ state: 'frozen', ySplit: 7 }] });
    [11, 7.25, 36, 10, 58, 50].forEach((wd, i) => { ws.getColumn(i + 1).width = wd; });
    const wrap = { wrapText: true, vertical: 'top' };
    [[1, 2], [2, 1], [3, 0]].forEach(([row, p]) => {
      ws.mergeCells(row, 1, row, 6);
      const c = ws.getCell(row, 1);
      c.value = `${ptsLabel(p)}: ${L[p].name}${L[p].desc ? ': ' + L[p].desc : ''}`;
      c.alignment = wrap;
      ws.getRow(row).height = 32;
    });
    ws.getCell(1, 1).font = { color: { argb: 'FF1C7C47' } };
    ws.getCell(2, 1).font = { color: { argb: 'FF8A5A00' } };
    ws.getCell(3, 1).font = { color: { argb: 'FFB42318' } };
    ws.getCell(4, 1).value = 'Assign 1 or 0. Otherwise, the grade will be 2.';
    ws.getCell(4, 1).font = { bold: true };
    const ta = ws.getCell(5, 3);
    ta.value = `TA Name (Write your name): ${w.ta || ''}`;
    ta.fill = FILL(YELLOW);
    ws.mergeCells(6, 1, 6, 6);
    const wk = ws.getCell(6, 1);
    wk.value = `Week - ${w.num}${w.topic ? ` (${w.topic})` : ''}`;
    wk.font = { bold: true, size: 13 };
    const head = ['Table', 'Group', 'Student Name', 'Assign 1 or 0 pts',
      `TA Notes:\nYELLOW ones are keywords for "${L[1].name}"-1 pt AND Red ones are keywords for "${L[0].name}" 0 pt`,
      'Optional: Please add additional notes if needed'];
    head.forEach((h, i) => {
      const c = ws.getCell(7, i + 1);
      c.value = h; c.font = { bold: true }; c.fill = FILL(HEAD); c.border = BORDER;
      c.alignment = { wrapText: true, vertical: 'middle' };
    });
    ws.getRow(7).height = 48;

    let r = 8;
    const firstRow = r;
    for (const t of input.tables) {
      for (const g of t.groups) {
        if (!g.students.length) continue;
        for (const s of g.students) {
          const rec = w.grades[s.sid];
          const pts = gradeOf(rec);
          const reasons = (rec && rec.reasons || []).map(k => KW.get(k)).filter(Boolean);
          ws.getCell(r, 1).value = tableVal(t);
          ws.getCell(r, 2).value = g.id || null;
          ws.getCell(r, 3).value = s.name;
          ws.getCell(r, 4).value = pts < 2 ? pts : null;
          ws.getCell(r, 4).alignment = { horizontal: 'center', vertical: 'top' };
          ws.getCell(r, 5).value = reasons.length ? reasons.map(k => k.full).join('\n') : null;
          ws.getCell(r, 6).value = rec && rec.note ? rec.note : null;
          ws.getCell(r, 5).alignment = wrap; ws.getCell(r, 6).alignment = wrap;
          if (pts < 2) {
            const f = FILL(pts === 1 ? Y_SOFT : R_SOFT);
            ws.getCell(r, 4).fill = f; ws.getCell(r, 5).fill = f;
          }
          for (let c = 1; c <= 6; c++) ws.getCell(r, c).border = BORDER;
          ws.getCell(r, 4).dataValidation = { type: 'list', allowBlank: true, showErrorMessage: true, formulae: ['"0,1"'] };
          if (active.length) ws.getCell(r, 5).dataValidation = { type: 'list', allowBlank: true, showErrorMessage: false, formulae: [kwRange] };
          if (reasons.length > 1) ws.getRow(r).height = 15 * reasons.length + 2;
          r++;
        }
        r++; // blank row between groups
      }
    }
    if (r === firstRow) r++;
    r += 1;
    for (const line of String(input.notes || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean)) {
      ws.getCell(r++, 1).value = line;
    }
  }

  const lists = wb.addWorksheet('Lists', { state: 'hidden' });
  active.forEach((k, i) => {
    lists.getCell(i + 1, 1).value = k.full;
    lists.getCell(i + 1, 2).value = k.lvl;
  });
  return wb;
}


function parseRosterSheetRows(rows) {
  // rows: array of arrays of cell values (strings/numbers). Finds a header with Table / Group / Name.
  const txt = v => {
    if (v == null) return '';
    if (typeof v === 'object') {
      if (v.richText) return v.richText.map(t => t.text).join('').trim();
      if ('text' in v) return String(v.text ?? '').trim();
      if ('result' in v) return String(v.result ?? '').trim();
      if (v instanceof Date) return '';
    }
    return String(v).trim();

/* ================= apply markers ================= */
function applyKey(sid, key, toggle) {
  if (!S.canWrite || !S.students.has(sid)) return;
  const before = recOf(sid);
  const r = before ? clone(before) : blankRec();
  r.reasons = r.reasons || [];
  let msg;
  if (key === 'G2') {
    r.g = 2; r.reasons = []; r.manual = false; msg = GRADE_LABEL.G2;
  } else if (key === 'G1' || key === 'G0') {
    const g = key === 'G1' ? 1 : 0;
    r.g = g; r.manual = true; msg = GRADE_LABEL[key];
  } else {
    const K = KW[key];
    if (r.reasons.includes(key)) {
      if (!toggle) { flashTile(sid); return; }
      r.reasons = r.reasons.filter(k => k !== key);
      if (!r.manual) r.g = computeG(r.reasons);
      msg = 'Removed: ' + K.short;
    } else {
      r.reasons.push(key);
      r.g = Math.min(typeof r.g === 'number' ? r.g : 2, K.lvl);
      msg = K.short;
    }
  }
  setRec(sid, r);
  flashTile(sid);
  const name = (S.students.get(sid) || {}).name || 'student';
  const wk = S.week;
  toast(`${msg} → ${name}`, 'Undo', () => { if (S.week === wk) setRec(sid, before ? clone(before) : blankRec()); });
}

function tileSig(sid) {
  const st = S.students.get(sid) || {};
  const r = recOf(sid);
  return JSON.stringify([st.name, st.photoFile || '', S.thumbs.get(sid) || '', r ? r.g : 2, r ? r.reasons : [], !!(r && r.note)]);
}
function tileInner(sid) {
  const st = S.students.get(sid) || {name:'?'};
  const r = recOf(sid);
  const g = r ? r.g : 2;
  const reasons = (r && r.reasons) || [];
  const ph = esc(initials(st.name)) + photoImg(sid, st);
  let why = '';
  if (reasons.length) why = esc(kwShort(reasons[0])) + (reasons.length > 1 ? ` +${reasons.length - 1}` : '');
  else if (g < 2) why = esc(levelShort(g));
  else if (r && r.note) why = 'Note';
  return `<span class="ph" style="--hue:${hue(st.name)}">${ph}</span>` +
    `<span class="badge" aria-hidden="true">${g}</span>` +
    (r && r.note ? `<span class="note-dot" aria-hidden="true">${ICON_NOTE}</span>` : '') +
    `<span class="nm">${esc(st.name)}</span>` +
    `<span class="why">${why || '&nbsp;'}</span>`;
}
function tileAria(sid) {
  const st = S.students.get(sid) || {};
  const r = recOf(sid);
  const g = r ? r.g : 2;
  const rs = ((r && r.reasons) || []).map(kwShort).join(', ');
  return `${st.name}, ${g} points${rs ? ', ' + rs : ''}`;
}
function tileHTML(sid) {
  return `<button type="button" class="tile" data-sid="${esc(sid)}" data-g="${gOf(sid)}" data-sig="${esc(tileSig(sid))}" aria-label="${esc(tileAria(sid))}">${tileInner(sid)}</button>`;
}
function patchTile(sid) {
  const el = $(`.tile[data-sid="${CSS.escape(sid)}"]`, $('#board'));
  if (!el) return;
  const sig = tileSig(sid);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  el.dataset.g = gOf(sid);
  el.setAttribute('aria-label', tileAria(sid));
  el.innerHTML = tileInner(sid);
  renderTableMeta(el.closest('.tbl'));
}
function flashTile(sid) {
  const el = $(`.tile[data-sid="${CSS.escape(sid)}"]`, $('#board'));
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  try { navigator.vibrate && navigator.vibrate(12); } catch {}
}
function tableMetaHTML(t) {
  let n1 = 0, n0 = 0, n = 0;
  for (const g of t.groups) for (const s of g.students) { n++; const v = gOf(s.sid); if (v === 1) n1++; if (v === 0) n0++; }
  return (n1 ? `<span class="mini m1">${n1} × 1</span>` : '') + (n0 ? `<span class="mini m0">${n0} × 0</span>` : '') + (!n1 && !n0 ? `<span class="mini" style="color:var(--muted)">${n} students</span>` : '');
}
function renderTableMeta(tblEl) {

  const t = tablesView().find(x => x.id === tblEl.dataset.table);
  const m = $('.tbl-meta', tblEl);

function renderBoard() {
  const board = $('#board');
  const loaded = S.mode === 'local' || (S.ready.layout && S.ready.students && (S.ready.grades || S.everLoaded));
  if (!loaded) {
    if (!$('.loading', board)) board.innerHTML = '<div class="loading">Loading your class…</div>';
    S.lastStruct = '';
    return;
  }
  S.everLoaded = true;
  const view = tablesView();
  const struct = JSON.stringify([S.editing, S.canWrite, view.map(t => [t.id, t.groups.map(g => [g.id, g.students.map(s => s.sid)])])]);
  if (struct === S.lastStruct) {
    for (const sid of S.students.keys()) patchTile(sid);
    $$('.tbl', board).forEach(renderTableMeta);
    return;
  }
  S.lastStruct = struct;
  board.classList.toggle('editing', S.editing);
  if (!view.length) {
    board.innerHTML = `<div class="state">
      <h2>Set up your tables</h2>
      <p>Each table shows its groups with a photo tile per student. Import your class list (ID, name, table, group, photo path) once; the app keeps it on this device. Then add photos from Photos.</p>

    }

        ? `<button type="button" class="add-tile" data-add="${esc(t.id)}|${esc(g.id)}"><b>+</b>Add student</button>` : '';
      const del = S.editing && !g.students.length ? `<button type="button" class="btn small quiet" data-delgroup="${esc(t.id)}|${esc(g.id)}" aria-label="Remove group ${esc(g.id)}">×</button>` : '';

      : `<div class="tbl-meta">${tableMetaHTML(t)}</div>`;
    return `<section class="tbl" data-table="${esc(t.id)}"><header class="tbl-h"><h2 class="tbl-n">Table <b>${esc(t.id)}</b></h2>${tools}</header>${groups || '<p class="hint" style="padding:8px 0">No groups yet.</p>'}</section>`;
  }).join('') + (S.editing ? `<button type="button" class="add-tile add-table" data-act="addtable"><b>+</b>Add a table</button>` : '');

/* ================= drag & tap markers ================= */
let drag = null;
const ghost = $('#ghost');
function chipLabelHTML(chip) {
  const s = $('.lbl-s', chip), f = $('.lbl-f', chip), dot = $('.dot', chip);
  const text = narrow() ? (s ? s.textContent : chip.textContent) : (f ? f.textContent : chip.textContent);
  return (dot ? '<i class="dot"></i>' : '') + `<span>${esc(text)}</span>`;
}
function onChipDown(e) {
  if (!S.canWrite) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const chip = e.currentTarget;
  drag = {key:chip.dataset.k, chip, id:e.pointerId, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, active:false, hot:null, type:e.pointerType, outTop:false, outBottom:false};
}
function startDrag() {
  drag.active = true;
  ghost.className = drag.chip.className.replace(/\b(armed|lifted)\b/g, '') + ' ghost';
  ghost.innerHTML = chipLabelHTML(drag.chip);
  ghost.hidden = false;
  drag.w = ghost.offsetWidth; drag.h = ghost.offsetHeight;
  drag.chip.classList.add('lifted');
  document.body.classList.add('dragging');
  requestAnimationFrame(autoScroll);
}
function placeGhost() {
  const off = drag.type === 'mouse' ? 14 : drag.h + 26;
  const x = Math.max(4, Math.min(window.innerWidth - drag.w - 4, drag.x - drag.w / 2));
  ghost.style.transform = `translate(${x}px, ${drag.y - off}px) scale(1.04)`;
}
function hitTest() {
  const el = document.elementFromPoint(drag.x, drag.y);
  const tile = el && el.closest ? el.closest('.tile[data-sid]') : null;
  if (tile !== drag.hot) {
    if (drag.hot) drag.hot.classList.remove('hot');
    drag.hot = tile;
    if (tile) tile.classList.add('hot');
  }
}
function edges() {
  const top = 84;
  const bottom = narrow() ? $('#rubric').getBoundingClientRect().top : window.innerHeight;
  return {top, bottom, bottomZone:bottom - 84};
}
function autoScroll() {
  if (!drag || !drag.active) return;
  const e = edges();
  if (drag.y > e.top + 10) drag.outTop = true;
  if (drag.y < e.bottomZone - 10) drag.outBottom = true;
  let v = 0;
  if (drag.outTop && drag.y < e.top) v = -Math.ceil((e.top - drag.y) / 5 + 3);
  else if (drag.outBottom && drag.y > e.bottomZone && drag.y < e.bottom + 40) v = Math.ceil((drag.y - e.bottomZone) / 5 + 3);
  if (v) { window.scrollBy(0, v); hitTest(); }
  requestAnimationFrame(autoScroll);
}
function endDrag(commit) {
  const d = drag; drag = null;
  if (!d) return;
  if (d.active) {
    ghost.hidden = true;
    d.chip.classList.remove('lifted');
    document.body.classList.remove('dragging');
    if (d.hot) d.hot.classList.remove('hot');
    if (commit && d.hot) applyKey(d.hot.dataset.sid, d.key, false);
  } else if (commit) {
    tapChip(d.key);
  }
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.active) {
    if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 8) return;
    startDrag();
  }
  e.preventDefault();
  placeGhost();
  hitTest();
}, {passive:false});
document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) endDrag(true); });
document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(false); });
window.addEventListener('blur', () => { if (drag) endDrag(false); });

function tapChip(key) {
  if (!S.canWrite) return;
  S.armed = S.armed === key ? null : key;
  $$('#rubric [data-k]').forEach(c => c.classList.toggle('armed', c.dataset.k === S.armed));
  renderModeBar();
}
function disarm() { if (S.armed) tapChip(S.armed); }
function bindChip(chip) {
  if (chip.dataset.bound) return;
  chip.dataset.bound = '1';
  chip.addEventListener('pointerdown', onChipDown);
  chip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapChip(chip.dataset.k); } });
  chip.addEventListener('contextmenu', e => e.preventDefault());
  chip.addEventListener('dragstart', e => e.preventDefault());
  const f = $('.lbl-f', chip);
  if (f) chip.title = f.textContent;
}
$$('#rubric [data-k]').forEach(bindChip);
function renderRubric() {
  const L = S.settings.levels;
  $('#rbH1').textContent = `${L[1].name} · 1 pt`;
  $('#rbH0').textContent = `${L[0].name} · 0 pt`;
  for (const lvl of [1, 0]) {
    const box = $('#rbChips' + lvl);
    $$('.chip:not(.G1):not(.G0)', box).forEach(c => c.remove());
    box.insertAdjacentHTML('beforeend', activeReasons(lvl).map(r =>
      `<div class="chip ${lvl === 1 ? 'y' : 'r'}" role="button" tabindex="0" data-k="${esc(r.key)}"><i class="dot"></i><span class="lbl-s">${esc(r.short)}</span><span class="lbl-f">${esc(r.full)}</span></div>`).join(''));
    $$('.chip', box).forEach(bindChip);
  }
  const notes = S.settings.notes.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  $('#rbRef').innerHTML = [2, 1, 0].map(p => `<p><b>${p} pt${p === 2 ? 's' : ''} · ${esc(L[p].name)}:</b> ${esc(L[p].desc)}</p>`).join('') + notes.map(x => `<p>${esc(x)}</p>`).join('');
  if (S.armed && !S.armed.startsWith('G') && !(KW[S.armed] && !KW[S.armed].archived)) S.armed = null;
  $$('#rubric [data-k]').forEach(c => c.classList.toggle('armed', c.dataset.k === S.armed));
}
function applySettings() {
  KW = {};
  for (const r of S.settings.reasons) KW[r.key] = r;
  KW_KEYS = S.settings.reasons.map(r => r.key);
  document.title = S.settings.title;
  $('#brandTitle').textContent = S.settings.title;
  renderRubric();
}

/* ================= board clicks ================= */
document.addEventListener('click', e => {
  const t = e.target;
  const act = t.closest && t.closest('[data-act]');
  if (act) { handleAct(act.dataset.act); return; }
  if (!t.closest || !t.closest('#board')) return;
  const tile = t.closest('.tile[data-sid]');
  if (tile) {
    if (S.armed) applyKey(tile.dataset.sid, S.armed, true);
    else openStudent(tile.dataset.sid);
    return;
  }
  const add = t.closest('[data-add]');
  if (add) { const [tb, gr] = add.dataset.add.split('|'); openAdd(tb, gr); return; }
  const ag = t.closest('[data-addgroup]');
  if (ag) { addGroup(ag.dataset.addgroup); return; }
  const dg = t.closest('[data-delgroup]');
  if (dg) { const [tb, gr] = dg.dataset.delgroup.split('|'); removeGroup(tb, gr); return; }
  const dt = t.closest('[data-deltable]');
  if (dt) { removeTable(dt.dataset.deltable); return; }
});
function handleAct(a) {
  if (a === 'roster') openRoster();
  else if (a === 'starter') starterLayout();
  else if (a === 'clearsamples') clearSamples();
  else if (a === 'disarm') disarm();
  else if (a === 'doneedit') { S.editing = false; renderAll(); }
  else if (a === 'addtable') addTable();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.sheet) closeSheet();
  else if (S.armed) disarm();
  else if (S.editing) { S.editing = false; renderAll(); }
});

/* ================= layout editing ================= */
function currentLayout() { return layoutFromView(tablesView()); }
function starterLayout() {
  if (!S.canWrite) return;
  saveLayout({tables:['1','2','3'].map(id => ({id, groups:[...GROUPS_DEFAULT]}))});
  S.editing = true;
  renderAll();
}
function addTable() {
  const L = currentLayout();
  const nums = L.tables.map(t => parseInt(t.id, 10)).filter(n => !isNaN(n));
  const id = String((nums.length ? Math.max(...nums) : 0) + 1);
  L.tables.push({id, groups:[...GROUPS_DEFAULT]});
  saveLayout(L); renderAll();
}
function addGroup(tid) {
  const L = currentLayout();
  const t = L.tables.find(x => x.id === tid); if (!t) return;
  let c = 'a';
  while (t.groups.includes(c)) c = String.fromCharCode(c.charCodeAt(0) + 1);
  t.groups.push(c);
  saveLayout(L); renderAll();
}
function removeGroup(tid, gid) {
  const L = currentLayout();
  const t = L.tables.find(x => x.id === tid); if (!t) return;
  t.groups = t.groups.filter(g => g !== gid);
  saveLayout(L); renderAll();
}
function removeTable(tid) {
  const L = currentLayout();
  L.tables = L.tables.filter(t => t.id !== tid);
  saveLayout(L); renderAll();
}
function nextOrder(tid, gid) {
  let m = -1;
  for (const s of S.students.values()) if (String(s.table || '') === tid && String(s.group || '') === gid) m = Math.max(m, s.order ?? 0);
  return m + 1;
}
function putStudent(sid, st, delay = 0) { S.students.set(sid, st); persist(PATH.student(sid), st, delay); }

  const unknown = recReasons.filter(k => !KW[k]);
  const kwBtn = r => `<button type="button" class="kwb ${r.lvl === 1 ? 'y' : 'r'}" data-kw="${esc(r.key)}" aria-pressed="false"${ro ? ' disabled' : ''}><span class="box">${ICON_CHECK}</span><span>${esc(r.full)}</span><span class="lv">${r.lvl} pt</span></button>`;
  const sh = openSheet('student', `
    <div class="sh-head">
      <div class="sh-photo">
        <div class="ph" id="stPh" style="--hue:${hue(st.name)}"></div>

/* ----- CSV class list ----- */
function decodeText(buf) {
  let t;
  try { t = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch { try { t = new TextDecoder('windows-1254').decode(buf); } catch { t = new TextDecoder().decode(buf); } }
  return t.replace(/^﻿/, '');
}
function parseCSV(text) {
  const first = (text.split(/\r?\n/).find(l => l.trim()) || '');
  const delim = ['\t', ';', ','].map(d => [d, first.split(d).length - 1]).sort((a, b) => b[1] - a[1])[0];
  const D = delim[1] > 0 ? delim[0] : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"' && field.trim() === '') { q = true; field = ''; }
    else if (c === D) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
function mapClassRows(rows) {
  const out = {entries:[], dupes:[], noId:0};
  if (!rows.length) return out;
  const H = rows[0].map(h => norm(h).split(' ').filter(Boolean));
  const has = (toks, list) => toks.some(t => list.includes(t));
  const NAME = ['name', 'names', 'ad', 'adi', 'isim', 'isim soyisim', 'adsoyad'], SUR = ['surname', 'soyad', 'soyadi', 'soyisim', 'last'];
  const col = {id:-1, name:-1, sur:-1, table:-1, group:-1, photo:-1};
  H.forEach((t, i) => {
    if (col.table < 0 && has(t, ['table', 'masa'])) col.table = i;
    else if (col.group < 0 && has(t, ['group', 'grup'])) col.group = i;
    else if (col.photo < 0 && has(t, ['photo', 'foto', 'fotograf', 'resim', 'image', 'picture', 'path'])) col.photo = i;
    else if (col.name < 0 && has(t, NAME)) col.name = i;
    else if (col.sur < 0 && has(t, SUR)) col.sur = i;
    else if (col.id < 0 && (has(t, ['id', 'numara', 'no', 'numarasi', 'sid']) || t.join(' ').includes('student number'))) col.id = i;
  });
  const header = col.name >= 0 && (col.table >= 0 || col.id >= 0 || col.group >= 0);
  if (!header) Object.assign(col, {id:0, name:1, sur:-1, table:2, group:3, photo:4});
  const seen = new Set();
  for (const r of rows.slice(header ? 1 : 0)) {
    const g = i => (i >= 0 && i < r.length ? String(r[i] || '').trim() : '');
    let name = g(col.name); if (col.sur >= 0 && g(col.sur)) name = (name + ' ' + g(col.sur)).trim();
    name = name.replace(/\s+/g, ' ');
    if (!name || name.length > 80) continue;
    const id = g(col.id).replace(/\.0+$/, '');
    const table = g(col.table).replace(/\.0+$/, '').replace(/^(table|masa)\s*/i, '');
    const group = g(col.group).replace(/^(group|grup)\s*/i, '').toLowerCase();
    if (id) { if (seen.has(id)) { out.dupes.push(id); continue; } seen.add(id); }
    else out.noId++;
    out.entries.push({id, name, table, group, photo:g(col.photo)});
  }
  return out;
}
const cleanId = id => String(id || '').trim().replace(/\.0+$/, '').replace(/[^A-Za-z0-9_-]/g, '');
function legacyMatch(e) {
  const nn = norm(e.name);
  for (const [sid, st] of S.students) if (!st.studentId && norm(st.name) === nn) return sid;
  return null;
}
function sidFor(e) {
  const id = cleanId(e.id);
  if (id) return 'id-' + id;
  const m = legacyMatch(e);
  return m;
}
function migrateSid(from, to) {
  for (const p of Object.keys(LOCAL)) {
    if (p.startsWith('grades/') && p.endsWith('__' + from)) {
      const v = LOCAL[p];
      persist(p.slice(0, -from.length) + to, {...v, sid:to});
      persist(p, DEL);
    }
  }
  if (S.grades.has(from)) { S.grades.set(to, {...S.grades.get(from), sid:to}); S.grades.delete(from); }
  if (S.thumbs.has(from)) thumbMove(from, to);
  const cur = S.students.get(from);

function commitCsv(entries, removeMissing, fileName) {
  if (!S.canWrite || !entries.length) return;
  const seated = autoSeat(entries, new Map());
  const keep = new Set();
  const counters = new Map();
  for (const e of seated) {
    let sid = sidFor(e);
    let cur = sid ? S.students.get(sid) : null;
    if (sid && !cur && cleanId(e.id)) {
      const old = legacyMatch(e);
      if (old) cur = migrateSid(old, sid);
    }
    if (!sid) sid = newId();
    if (keep.has(sid)) continue;
    keep.add(sid);
    const k = e.table + '|' + e.group;
    const o = counters.get(k) || 0; counters.set(k, o + 1);
    const st = {...(cur || {}), name:e.name, table:String(e.table), group:String(e.group), order:o};
    delete st.ex;
    if (cleanId(e.id)) st.studentId = String(e.id).trim().replace(/\.0+$/, '');
    if (e.photo) st.photoPath = e.photo;
    putStudent(sid, st);
  }
  if (removeMissing) for (const sid of [...S.students.keys()]) if (!keep.has(sid)) { S.students.delete(sid); persist(PATH.student(sid), DEL); }
  const L = removeMissing ? {tables:[]} : currentLayout();
  for (const e of seated) {
    if (!e.table) continue;
    let t = L.tables.find(x => x.id === String(e.table));
    if (!t) { t = {id:String(e.table), groups:[]}; L.tables.push(t); }
    if (!t.groups.includes(String(e.group))) t.groups.push(String(e.group));
  }
  L.tables.sort((a, b) => natural(a.id, b.id));
  L.tables.forEach(t => t.groups.sort(natural));
  saveLayout(L);
  S.found.clear(); S.missing.clear();
  S.editing = false; S.lastStruct = '';
  lsSet(bkey('lastimport'), JSON.stringify({file:fileName, count:keep.size, at:new Date().toISOString()}));
  askPersist();
  renderAll();
  toast(`${keep.size} students imported from ${fileName}`);
}

function parsePaste(text) {
  const out = [];
  for (let line of String(text || '').split(/\r?\n/)) {
    line = line.trim(); if (!line) continue;
    let parts = line.split('\t').map(s => s.trim());
    if (parts.length === 1) parts = line.split(/\s*[,;]\s*/);
    if (/^table$/i.test(parts[0]) || /student\s*name/i.test(line)) continue;
    let table = '', group = '', name = '';
    if (parts.length >= 3 && /^\d+$/.test(parts[0]) && /^[a-z]$/i.test(parts[1])) { table = parts[0]; group = parts[1].toLowerCase(); name = parts.slice(2).join(' '); }
    else if (parts.length === 2 && /^\d+\s*[-/.]?\s*[a-z]$/i.test(parts[0])) { const m = parts[0].match(/^(\d+)\s*[-/.]?\s*([a-z])$/i); table = m[1]; group = m[2].toLowerCase(); name = parts[1]; }
    else {
      const m = line.match(/^(\d+)\s*[-/.]?\s*([a-zA-Z])[\s,;:.)\-]+(.+)$/);
      if (m) { table = m[1]; group = m[2].toLowerCase(); name = m[3]; }
      else name = parts.filter(Boolean).join(' ');
    }
    name = name.replace(/\s+/g, ' ').trim();
    if (name && name.length <= 80) out.push({table, group, name});
  }
  return out;
}
function autoSeat(entries) {
  // Students keep the table/group they were given; no table means Unassigned.
  return entries.map(e => {
    const table = String(e.table || '').trim();
    return {...e, table, group:table ? String(e.group || '').trim().toLowerCase() : ''};
  });
}
async function readRosterXlsx(file) {
  const ExcelJS = await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  let best = [];
  for (const ws of wb.worksheets) {
    const rows = [];
    ws.eachRow({includeEmpty:true}, (row, i) => { rows[i - 1] = (row.values || []).slice(1); });
    for (let i = 0; i < rows.length; i++) rows[i] = rows[i] || [];
    const got = parseRosterSheetRows(rows);
    if (got.length > best.length) best = got;
  }
  return best;
}
function commitRoster(entries, replace) {
  if (!S.canWrite || !entries.length) return;
  const occupancy = new Map();
  if (!replace) for (const s of S.students.values()) { const k = s.table + '|' + s.group; occupancy.set(k, (occupancy.get(k) || 0) + 1); }
  const seated = autoSeat(entries, occupancy);
  const photos = new Map();
  if (replace) {
    for (const [id, s] of S.students) photos.set(norm(s.name), {id, file:s.photoFile, thumb:s.thumb});
    const sampleIds = [...S.students.entries()].filter(([, s]) => s.ex).map(([id]) => id);
    for (const id of [...S.students.keys()]) persist(PATH.student(id), DEL);
    S.students = new Map();
    if (sampleIds.length) deleteGradesFor(new Set(sampleIds));
  }
  const counters = new Map();
  for (const e of seated) {
    const k = e.table + '|' + e.group;
    const base = replace ? 0 : nextOrder(e.table, e.group);
    const o = (counters.get(k) ?? base);
    counters.set(k, o + 1);
    const st = {name:e.name, table:String(e.table), group:String(e.group), order:o};
    const sidNew = newId();
    const p = photos.get(norm(e.name));
    if (p && !p.used) {
      p.used = true;
      if (p.file) st.photoFile = p.file;
      if (p.thumb) st.thumb = p.thumb;
      if (S.thumbs.has(p.id) && !p.thumb) thumbMove(p.id, sidNew);
      else if (p.thumb) setThumbURL(sidNew, p.thumb);
    }
    putStudent(sidNew, st);
  }
  for (const p of photos.values()) if (!p.used && S.thumbs.has(p.id)) thumbDel(p.id);
  const L = replace ? {tables:[]} : currentLayout();
  for (const e of seated) {
    if (!e.table) continue;
    let t = L.tables.find(x => x.id === String(e.table));
    if (!t) { t = {id:String(e.table), groups:[]}; L.tables.push(t); }
    if (!t.groups.includes(String(e.group))) t.groups.push(String(e.group));
  }
  L.tables.sort((a, b) => natural(a.id, b.id));
  L.tables.forEach(t => t.groups.sort(natural));
  saveLayout(L);
  S.editing = false;
  renderAll();
  toast(`${seated.length} students ${replace ? 'imported' : 'added'}`);
}
async function deleteGradesFor(sids) {
  for (const sid of [...S.grades.keys()]) if (sids.has(sid)) { S.grades.delete(sid); persist(PATH.grade(S.week, sid), DEL); }
  if (S.mode === 'local') {

async function resizeImage(file, size, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({code:'decode'}); i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
    const sx = (w - s) / 2, sy = (h - s) * 0.3;
    const c = document.createElement('canvas');
    c.width = c.height = Math.min(size, s);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, sx, sy, s, s, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej({code:'decode'}), 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function photoError(err) {
  const c = err && err.code;
  if (c === 'decode') return "That file couldn't be opened as a photo. Try a JPG or PNG.";
  if (c === 'quota_or_state') return 'Photo storage is full. Remove some photos first.';
  if (c === 'rate_limited') return 'Too many uploads at once. Wait a moment and try again.';
  if (c === 'too_large') return 'That photo is too large.';
  return "The photo couldn't be saved. Check your connection and try again.";
}
async function setPhoto(sid, file) {

  S.found.delete(sid); S.missing.delete(sid);
  patchTile(sid);
}
function removePhoto(sid) {
  const cur = S.students.get(sid); if (!cur) return;
  thumbDel(sid);
  const next = {...(S.students.get(sid) || cur)}; delete next.photoFile; delete next.thumb;

function matchStudent(fileName) {
  const base = norm(fileName.replace(/\.[^.]+$/, ''));
  const ft = base.split(' ').filter(Boolean);
  const fs = [...ft].sort().join(' ');
  let best = null, bestScore = 0, tie = false;
  for (const [sid, st] of S.students) {
    const sn = norm(st.name); if (!sn) continue;
    const st_ = sn.split(' ');
    let score = 0;
    const pb = st.photoPath ? norm(cleanPhotoPath(st.photoPath).split('/').pop().replace(/\.[^.]+$/, '')) : '';
    if (pb && pb === base) score = 5;
    else if (st.studentId && norm(st.studentId) === base) score = 4;
    else if (sn === base || [...st_].sort().join(' ') === fs) score = 3;
    else if (st_.every(t => ft.includes(t))) score = 2;
    else if (sn.length > 3 && (base.includes(sn) || (base.length > 3 && sn.includes(base)))) score = 1;
    if (score > bestScore) { best = sid; bestScore = score; tie = false; }
    else if (score && score === bestScore) tie = true;
  }
  return bestScore && !tie ? best : '';
}

let xlPromise = null;
function loadExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!xlPromise) xlPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'exceljs.min.js';
    sc.onload = () => window.ExcelJS ? res(window.ExcelJS) : rej(new Error('ExcelJS missing'));
    sc.onerror = () => { xlPromise = null; rej(new Error('ExcelJS failed to load')); };
    document.head.appendChild(sc);
  });
  return xlPromise;
}
function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
/* Phones and tablets: hand the file to the Share sheet (Save to Files, Drive, Mail…) from a tap.
   Computers without file sharing: download straight away. */
function offerFile(host, filename, blob, onSaved) {
  let file = null, canShare = false;
  try { file = new File([blob], filename, {type:blob.type}); canShare = !!(navigator.canShare && navigator.canShare({files:[file]})); } catch {}
  if (!canShare) {
    downloadBlob(filename, blob);
    if (onSaved) onSaved();
    host.innerHTML = `<div class="ready"><p>Saved <b>${esc(filename)}</b> to your downloads.</p><div class="btnrow"><button class="btn small" type="button" data-dl>Download again</button></div></div>`;
  } else {
    host.innerHTML = `<div class="ready"><p><b>${esc(filename)}</b> is ready.</p><div class="btnrow"><button class="btn primary" type="button" data-share>Save or share…</button><button class="btn" type="button" data-dl>Download</button></div><p class="hint">Save or share opens the menu with Save to Files, Google Drive, Mail and more.</p></div>`;
    $('[data-share]', host).addEventListener('click', async () => {
      try { await navigator.share({files:[file], title:filename}); if (onSaved) onSaved(); }
      catch (e) { if (!e || e.name !== 'AbortError') toast("Sharing didn't work here. Use Download instead."); }
    });
  }
  $('[data-dl]', host).addEventListener('click', () => { downloadBlob(filename, blob); if (onSaved) onSaved(); });
}
