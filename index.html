        for (const [sid, u] of S.thumbs) {
          if (u.startsWith('data:')) continue;
          try { data.photos[sid] = await blobToDataURL(await blobFromURL(u)); } catch {}
        }
      }
      const d = new Date();
      const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      offerFile(out, `${slug(S.settings.title)}_Backup_${stamp}.json`, new Blob([JSON.stringify(data)], {type:'application/json'}), () => {
        lsSet(bkey('lastbackup'), data.savedAt);
        const bl = $('#bLast'); if (bl) bl.textContent = 'Last backup: ' + new Date(data.savedAt).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'});
      });
    } catch (e) { console.warn(e); out.innerHTML = "<p class=\"hint\">The backup couldn't be prepared. Try again.</p>"; }
  });
  $('#bFile').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const out = $('#bStatus');
    let data;
    try { data = JSON.parse(await f.text()); } catch { data = null; }
    if (!isBoardFile(data)) {
      out.innerHTML = `<p class="hint">${esc(f.name)} isn't a backup from this board.</p>`; return;
    }
    if (isSettingsOnly(data)) {
      saveSettings(data.paths[SETTINGS_PATH]);
      out.innerHTML = `<p class="hint">Settings loaded from ${esc(f.name)}. Students and grades were not changed.</p>`;
      return;
    }
    const nSt = Object.keys(data.paths).filter(p => p.startsWith('students/')).length;
    const when = data.savedAt ? new Date(data.savedAt).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) : 'an unknown date';
    out.innerHTML = `<div class="confirm">Replace everything in the board “${esc(S.settings.title)}” with the backup from ${esc(when)} (${nSt} students)? Other boards are not affected. <button class="btn small danger" type="button" id="bYes">Replace</button><button class="btn small" type="button" id="bNo">Cancel</button></div>`;
    $('#bNo').addEventListener('click', () => { out.innerHTML = '<p class="hint">Nothing changed.</p>'; });
    $('#bYes').addEventListener('click', async () => {
      out.innerHTML = '<p class="hint">Restoring…</p>';
      const keepSettings = data.paths[SETTINGS_PATH] ? null : clone(LOCAL[SETTINGS_PATH] || null);
      LOCAL = clone(data.paths);
      if (keepSettings) LOCAL[SETTINGS_PATH] = keepSettings;
      try { localStorage.setItem(dataKey(), JSON.stringify(LOCAL)); S.localOk = true; } catch { S.localOk = false; }
      if (data.photos) for (const [sid, u] of Object.entries(data.photos)) { try { await thumbPut(sid, await blobFromURL(u)); } catch {} }
      S.found.clear(); S.missing.clear();
      hydrateLocal();
      S.lastStruct = '';
      askPersist();
      closeSheet();
      renderAll();
      toast(`Backup restored: ${nSt} students`);
    });
  });
}

/* ================= boards (course / section / semester) ================= */
function syncBoardTitle() {
  const list = readBoards();
  const b = list.find(x => x.id === S.board);
  if (!b) list.push({id:S.board, title:S.settings.title});
  else if (b.title !== S.settings.title) b.title = S.settings.title;
  writeBoards(list);
}
function boardSummary(id) {
  const d = id === S.board ? LOCAL : boardData(id);
  return {title:mergeSettings(d[SETTINGS_PATH]).title, n:Object.keys(d).filter(p => p.startsWith('students/')).length};
}
function saveLocalNow() {
  clearTimeout(saveLocalSoon.t);
  try { localStorage.setItem(dataKey(), JSON.stringify(LOCAL)); S.localOk = true; } catch { S.localOk = false; }
}
async function switchBoard(id, skipSave) {
  if (!skipSave) saveLocalNow();
  disarm();
  closeSheet();
  S.board = id; lsSet(CUR_KEY, id);
  S.editing = false;
  for (const u of S.thumbs.values()) if (u.startsWith('blob:')) URL.revokeObjectURL(u);
  S.thumbs = new Map(); S.found.clear(); S.missing.clear();
  const wp = parseInt(lsGet(bkey('week'), '0'), 10) || 0;
  S.week = Math.min(52, Math.max(1, wp || 1)); S.weekFromPref = !!wp;
  await thumbsLoad();
  startLocal();
  syncBoardTitle();
  S.lastStruct = '';
  renderAll();
  window.scrollTo(0, 0);
  toast(`Opened ${S.settings.title}`);
}
function createBoard(name, copySettings) {
  const id = 'b' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  const st = copySettings ? clone(S.settings) : clone(DEFAULT_SETTINGS);
  st.title = name;
  if (copySettings) st.reasons = st.reasons.filter(r => !r.archived);
  try { localStorage.setItem(dataKey(id), JSON.stringify({[SETTINGS_PATH]:mergeSettings(st)})); }
  catch { toast("There's no room on this device for another board."); return; }
  const list = readBoards(); list.push({id, title:name}); writeBoards(list);
  switchBoard(id);
}
async function deleteBoard(id) {
  const list = readBoards().filter(b => b.id !== id);
  if (!list.length) return;
  try { localStorage.removeItem(dataKey(id)); } catch {}
  for (const k of ['week', 'lastimport', 'lastbackup']) { try { localStorage.removeItem(bkey(k, id)); } catch {} }
  if (IDB.db) await new Promise(res => {
    try {
      const tx = IDB.db.transaction('p', 'readwrite');
      const req = tx.objectStore('p').openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { if (ownKey(c.key, id) !== null) c.delete(); c.continue(); } };
      tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
    } catch { res(); }
  });
  writeBoards(list);
  await switchBoard(list[0].id, true);
}
function openBoards() {
  saveLocalNow();
  const list = readBoards();
  const rows = list.map(b => {
    const sm = boardSummary(b.id);
    return `<button type="button" class="board-row${b.id === S.board ? ' current' : ''}" data-board="${esc(b.id)}"><span class="bt">${esc(sm.title)}</span><span class="bm">${sm.n} student${sm.n === 1 ? '' : 's'}${b.id === S.board ? ' · open now' : ''}</span></button>`;
  }).join('');
  openSheet('boards', `
    <h2>Boards</h2>
    <p class="hint">Each board has its own students, grades, photos and settings, kept separately on this device. Use one for each course, section or semester.</p>
    <div class="boards">${rows}</div>
    <div>
      <h3>New board</h3>
      <label class="fv"><span>Name</span><input id="nbName" autocomplete="off" placeholder="Course, section or semester"></label>
      <label class="chk"><input type="checkbox" id="nbCopy" checked> Copy settings from “${esc(S.settings.title)}” (rubric, weeks, topics)</label>
      <div class="btnrow"><button class="btn primary" type="button" id="nbGo">Create and open</button></div>
      <p class="hint">To bring a backup in as its own board, create a new board, then use Export → Load backup in it.</p>
    </div>
    ${list.length > 1 ? `<div><h3>Delete this board</h3><div id="dbWrap"><button class="btn danger" type="button" id="dbDel">Delete “${esc(S.settings.title)}”…</button></div></div>` : ''}
    <div class="sh-foot"><span></span><button class="btn" type="button" data-close>Close</button></div>`);
  $$('.board-row').forEach(b => b.addEventListener('click', () => { const id = b.dataset.board; if (id === S.board) closeSheet(); else switchBoard(id); }));
  const go = () => { const name = $('#nbName').value.trim(); if (!name) { $('#nbName').focus(); return; } createBoard(name, $('#nbCopy').checked); };
  $('#nbGo').addEventListener('click', go);
  $('#nbName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
  const del = $('#dbDel');
  if (del) del.addEventListener('click', () => {
    const n = S.students.size;
    $('#dbWrap').innerHTML = `<div class="confirm">Delete “${esc(S.settings.title)}” with ${n} student${n === 1 ? '' : 's'}, its grades and photos from this device? Save a backup first if you might need it. <button class="btn small danger" type="button" id="dbYes">Delete board</button><button class="btn small" type="button" id="dbNo">Cancel</button></div>`;
    $('#dbNo').addEventListener('click', () => openBoards());
    $('#dbYes').addEventListener('click', () => deleteBoard(S.board));
  });
}

/* ================= settings sheet ================= */
const isBoardFile = d => !!(d && d.paths && typeof d.paths === 'object' && Object.keys(d.paths).length &&
  Object.keys(d.paths).every(k => /^(meta|students|grades|weeks)\//.test(k)));
const isSettingsOnly = d => isBoardFile(d) && Object.keys(d.paths).every(k => k === SETTINGS_PATH);
function usedReasonKeys() {
  const used = new Set();
  for (const [p, v] of Object.entries(LOCAL)) if (p.startsWith('grades/') && v && Array.isArray(v.reasons)) v.reasons.forEach(k => used.add(k));
  for (const r of S.grades.values()) (r.reasons || []).forEach(k => used.add(k));
  return used;
}
function saveSettings(v) {
  S.settings = mergeSettings(v);
  persist(SETTINGS_PATH, S.settings);
  applySettings();
  syncBoardTitle();
  if (S.week > maxWeek()) setWeek(maxWeek());
  if (document.activeElement !== $('#wkTopic')) $('#wkTopic').value = topicFor(S.week);
  S.lastStruct = '';
  renderAll();
}
function openSettings() {
  const st = S.settings, L = st.levels;
  const lvlBlock = p => `<div class="lvl"><h3>${p} point${p === 1 ? '' : 's'}</h3>
      <div class="seat"><label class="fv"><span>Name</span><input data-lv="${p}" data-f="name" value="${esc(L[p].name)}"></label>
      <label class="fv"><span>Short label</span><input data-lv="${p}" data-f="short" value="${esc(L[p].short)}"></label></div>
      <label class="fv"><span>Description</span><textarea rows="2" data-lv="${p}" data-f="desc">${esc(L[p].desc)}</textarea></label></div>`;
  const reasonRow = r => `<div class="rrow" data-key="${esc(r.key)}" data-lvl="${r.lvl}">
      <select data-f="lvl" aria-label="Points"><option value="1"${r.lvl === 1 ? ' selected' : ''}>1 pt</option><option value="0"${r.lvl === 0 ? ' selected' : ''}>0 pt</option></select>
      <input data-f="short" placeholder="Short label" value="${esc(r.short)}" aria-label="Short label">
      <input data-f="full" placeholder="Full text (tablet and Excel)" value="${esc(r.full)}" aria-label="Full text">
      <button class="icon rdel" type="button" aria-label="Remove this reason">×</button></div>`;
  openSheet('settings', `
    <h2>Settings</h2>
    <p class="hint">Settings stay on this device and are included in backups. Save them as a settings file to keep or to give other graders; the file has no student data.</p>
    <div class="seat">
      <label class="fv"><span>Board name</span><input id="sTitle" value="${esc(st.title)}" autocomplete="off"></label>
      <label class="fv"><span>Number of weeks</span><input id="sWeeks" type="number" min="1" max="52" inputmode="numeric" value="${st.weeks}"></label>
    </div>
    <div><h3>Rubric levels</h3><div class="lvls">${[2, 1, 0].map(lvlBlock).join('')}</div></div>
    <div><h3>Reasons (markers)</h3>
      <p class="hint" style="margin-bottom:8px">Short labels show on phones; the full text shows on tablets and in Excel. Removing a reason that was already used keeps it in old grades.</p>
      <div class="rlist" id="sReasons">${activeReasons().map(reasonRow).join('')}</div>
      <div class="btnrow" style="margin-top:8px"><button class="btn small" type="button" id="sAdd1">+ 1 pt reason</button><button class="btn small" type="button" id="sAdd0">+ 0 pt reason</button></div>
    </div>
    <details class="more"><summary>Week topics</summary><div>
      <p class="hint">Shown next to the week number and in Excel as "Week - 3 (Topic)". A topic typed on the main screen for one week takes priority over these.</p>
      <div class="topics" id="sTopics"></div>
    </div></details>
    <label class="fv"><span>Notes printed under each Excel week (one per line)</span><textarea id="sNotes" rows="3">${esc(st.notes)}</textarea></label>
    <div class="btnrow"><button class="btn primary" type="button" id="sSave">Save settings</button></div>
    <div><h3>Settings file</h3>
      <p class="hint">Loading a settings file replaces the board name and rubric. Students and grades stay as they are.</p>
      <div class="btnrow" style="margin-top:8px"><button class="btn" type="button" id="sExport">Save settings file</button><label class="btn file">Load settings file…<input type="file" id="sImport" accept=".json,application/json"></label></div>
      <div id="sOut" role="status" style="margin-top:8px"></div>
    </div>
    <div class="sh-foot"><span></span><button class="btn" type="button" data-close>Close</button></div>`);
  const topicsBox = $('#sTopics');
  const readTopics = () => {
    const t = {...st.topics};
    $$('[data-tw]', topicsBox).forEach(i => { const w = +i.dataset.tw; if (i.value.trim()) t[w] = i.value.trim(); else delete t[w]; });
    return t;
  };
  const renderTopics = () => {
    const cur = readTopics();
    const n = Math.max(1, Math.min(52, parseInt($('#sWeeks').value, 10) || st.weeks));
    topicsBox.innerHTML = Array.from({length:n}, (_, i) => `<label class="tw"><span>W${i + 1}</span><input data-tw="${i + 1}" value="${esc(cur[i + 1] || '')}" aria-label="Week ${i + 1} topic" autocomplete="off"></label>`).join('');
  };
  renderTopics();
  $('#sWeeks').addEventListener('change', renderTopics);
  const list = $('#sReasons');
  const addRow = lvl => {
    list.insertAdjacentHTML('beforeend', reasonRow({key:'k' + Math.random().toString(36).slice(2, 8), lvl, short:'', full:''}));
    $('[data-f="short"]', list.lastElementChild).focus();
  };
  $('#sAdd1').addEventListener('click', () => addRow(1));
  $('#sAdd0').addEventListener('click', () => addRow(0));
  list.addEventListener('click', e => { const b = e.target.closest('.rdel'); if (b) b.closest('.rrow').remove(); });
  list.addEventListener('change', e => { const sel = e.target.closest('[data-f="lvl"]'); if (sel) sel.closest('.rrow').dataset.lvl = sel.value; });
  const collect = () => {
    const levels = {};
    for (const p of [2, 1, 0]) {
      const v = f => $(`[data-lv="${p}"][data-f="${f}"]`).value.trim();
      levels[p] = {name:v('name') || L[p].name, short:v('short') || v('name') || L[p].short, desc:v('desc')};
    }
    const rows = $$('.rrow', list).map(r => ({key:r.dataset.key, lvl:+$('[data-f="lvl"]', r).value, short:$('[data-f="short"]', r).value.trim(), full:$('[data-f="full"]', r).value.trim()}))
      .filter(r => r.short || r.full).map(r => ({...r, short:r.short || r.full.slice(0, 28), full:r.full || r.short}));
    const kept = new Set(rows.map(r => r.key));
    const used = usedReasonKeys();
    const archived = st.reasons.filter(r => !kept.has(r.key) && used.has(r.key)).map(r => ({...r, archived:true}));
    return {title:$('#sTitle').value.trim(), weeks:parseInt($('#sWeeks').value, 10), levels, reasons:[...rows, ...archived], notes:$('#sNotes').value, topics:readTopics()};
  };
  $('#sSave').addEventListener('click', () => { saveSettings(collect()); closeSheet(); toast('Settings saved'); });
  $('#sExport').addEventListener('click', () => {
    saveSettings(collect());
    const data = {app:APP_ID, kind:'settings', version:1, savedAt:new Date().toISOString(), paths:{[SETTINGS_PATH]:S.settings}};
    offerFile($('#sOut'), `${slug(S.settings.title)}_settings.json`, new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
  });
  $('#sImport').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    let data = null;
    try { data = JSON.parse(await f.text()); } catch {}
    if (!isBoardFile(data) || !data.paths[SETTINGS_PATH]) { $('#sOut').innerHTML = `<p class="hint">${esc(f.name)} has no settings from this board.</p>`; return; }
    saveSettings(data.paths[SETTINGS_PATH]);
    closeSheet();
    toast(`Settings loaded from ${f.name}`);
  });
}

/* ================= header controls ================= */
function setWeek(w) {
  w = Math.max(1, Math.min(maxWeek(), w));
  if (w === S.week) return;
  flushAll();
  S.week = w; lsSet(bkey('week'), String(w));
  S.grades = new Map();
  if (S.mode === 'db') subscribeGrades();
  else hydrateLocalWeek();
  disarm();
  renderAll();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t && t.matches && t.matches('input[data-csv]')) { const f = t.files && t.files[0]; t.value = ''; if (f) openRoster(f); }
});
$('#wkSel').addEventListener('change', e => setWeek(+e.target.value));
$('#wkPrev').addEventListener('click', () => setWeek(S.week - 1));
$('#wkNext').addEventListener('click', () => setWeek(S.week + 1));
$('#wkTA').addEventListener('input', () => saveWeekMeta(700));
$('#wkTopic').addEventListener('input', () => saveWeekMeta(700));
$('#btnSettings').addEventListener('click', openSettings);
$('#btnBoards').addEventListener('click', openBoards);
$('#btnRoster').addEventListener('click', () => openRoster());
$('#btnPhotos').addEventListener('click', openPhotos);
$('#btnExport').addEventListener('click', openExport);
$('#trayToggle').addEventListener('click', () => {
  const r = $('#rubric'); const c = !r.classList.contains('collapsed');
  r.classList.toggle('collapsed', c);
  $('#trayToggle').setAttribute('aria-expanded', String(!c));
  $('#trayToggle').setAttribute('aria-label', c ? 'Show markers' : 'Hide markers');
  lsSet('pboard-tray', c ? '0' : '1');
});
function applySize(sz) {
  $('#app').dataset.size = sz;
  $$('.sizes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === sz)));
  lsSet('pboard-size', sz);
  S.lastStruct = ''; renderBoard();
}
$$('.sizes button').forEach(b => b.addEventListener('click', () => applySize(b.dataset.size)));

/* tray height -> bottom padding on phones */
function syncTray() {
  const h = narrow() ? $('#rubric').getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty('--tray-h', h + 'px');
}
new ResizeObserver(syncTray).observe($('#rubric'));
window.addEventListener('resize', syncTray);

/* ================= data sources ================= */
function overlayBusy(map, prefix, idOf) {
  for (const p of busyPaths(prefix)) {
    const id = idOf(p);
    const local = Q.pending.has(p) ? Q.pending.get(p) : undefined;
    if (local === DEL) map.delete(id);
    else if (local !== undefined) map.set(id, clone(local));
  }
}
function dbFail(e) {
  console.warn('db', e);
  const c = e && e.code;
  if (c === 'revoked' || c === 'not_granted') setReadOnly();
  if (c === 'unavailable') setTimeout(() => { if (S.mode === 'db') startDb(true); }, 3000 + Math.random() * 2000);
}
function startDb(restart) {
  const db = S.db;
  if (restart) { Object.values(S.unsub).forEach(u => { try { u(); } catch {} }); S.unsub = {}; }
  S.unsub.layout = db.doc(PATH.layout).onSnapshot(snap => {
    if (!busy(PATH.layout)) S.layout = snap.exists ? clone(snap.data()) : null;
    S.ready.layout = true; scheduleRender();
  }, dbFail);
  S.unsub.students = db.collection('students').onSnapshot(qs => {
    const m = new Map();
    for (const d of qs.docs) m.set(d.id, clone(d.data()));
    for (const p of busyPaths('students/')) {
      const id = p.slice(9);
      if (Q.pending.has(p)) { const v = Q.pending.get(p); if (v === DEL) m.delete(id); else m.set(id, clone(v)); }
      else if (S.students.has(id)) m.set(id, S.students.get(id)); else m.delete(id);
    }
    S.students = m; S.ready.students = true; scheduleRender();
  }, dbFail);
  S.unsub.weeks = db.collection('weeks').onSnapshot(qs => {
    const m = new Map();
    for (const d of qs.docs) { const v = d.data(); if (v && v.week) m.set(+v.week, clone(v)); }
    for (const p of busyPaths('weeks/')) { const w = +p.slice(7); if (S.weeks.has(w)) m.set(w, S.weeks.get(w)); }
    const first = !S.ready.weeks;
    S.weeks = m; S.ready.weeks = true;
    if (first && !S.weekFromPref && m.size) { const max = Math.max(...m.keys()); if (max !== S.week) { setWeek(max); return; } }
    renderWeekSelect();
  }, dbFail);
  subscribeGrades();
}
function subscribeGrades() {
  if (S.unsub.grades) { try { S.unsub.grades(); } catch {} }
  const w = S.week;
  S.ready.grades = false;
  S.unsub.grades = S.db.collection('grades').where('week', '==', w).onSnapshot(qs => {
    if (w !== S.week) return;
    const m = new Map();
    for (const d of qs.docs) { const v = d.data(); if (v && v.sid) m.set(v.sid, clone(v)); }
    for (const p of busyPaths(`grades/w${w}__`)) {
      const sid = p.slice(`grades/w${w}__`.length);
      if (S.grades.has(sid)) m.set(sid, S.grades.get(sid)); else m.delete(sid);
    }
    S.grades = m; S.ready.grades = true;
    scheduleRender();
    if (S.sheet && S.sheet.kind === 'student') refreshStudentState();
  }, dbFail);
}
function hydrateLocal() {
  S.settings = mergeSettings(LOCAL[SETTINGS_PATH]);
  applySettings();
  if (S.week > maxWeek()) S.week = maxWeek();
  S.layout = LOCAL[PATH.layout] ? clone(LOCAL[PATH.layout]) : null;
  S.students = new Map();
  S.weeks = new Map();
  for (const [p, v] of Object.entries(LOCAL)) {
    if (p.startsWith('students/') && v) { S.students.set(p.slice(9), clone(v)); if (v.thumb && !S.thumbs.has(p.slice(9))) S.thumbs.set(p.slice(9), v.thumb); }
    if (p.startsWith('weeks/') && v && v.week) S.weeks.set(+v.week, clone(v));
  }
  hydrateLocalWeek();
}
function hydrateLocalWeek() {
  S.grades = new Map();
  const pre = `grades/w${S.week}__`;
  for (const [p, v] of Object.entries(LOCAL)) if (p.startsWith(pre) && v && v.sid) S.grades.set(v.sid, clone(v));
}
function startLocal() {
  S.mode = 'local';
  loadLocal();
  hydrateLocal();
  if (!S.weekFromPref && S.weeks.size) { S.week = Math.max(...S.weeks.keys()); hydrateLocalWeek(); }
  renderAll();
}

/* ================= boot ================= */
async function boot() {
  const size = lsGet('pboard-size', 'm');
  $('#app').dataset.size = size;
  $$('.sizes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === size)));
  if (lsGet('pboard-tray', '1') === '0') { $('#rubric').classList.add('collapsed'); $('#trayToggle').setAttribute('aria-expanded', 'false'); }
  const boards = readBoards();
  const cur = lsGet(CUR_KEY, '');
  S.board = boards.some(b => b.id === cur) ? cur : boards[0].id;
  const wp = parseInt(lsGet(bkey('week'), '0'), 10) || 0;
  S.week = Math.min(52, Math.max(1, wp || 1)); S.weekFromPref = !!wp;
  renderWeekSelect();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline support unavailable', e));
  }
  await thumbsLoad();
  startLocal();
  syncBoardTitle();
}
boot();
})();
